<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LANDOKMAI FAN • Mood Picker</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Prompt', sans-serif;
      background-image: url("bg2.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #f5f3ff;
      min-height: 100vh;
    }

    /* Overlay gradient */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, rgba(107,33,168,0.6), rgba(30,27,75,0.9));
      z-index: -1;
    }

    header {
      text-align: center;
      padding: 20px;
      font-family: 'Bungee', sans-serif;
      font-size: 2.2rem;
      background: rgba(173,126,221,0.9);
      backdrop-filter: blur(8px);
      color: white;
      letter-spacing: 1px;
    }

    nav {
      text-align: center;
      padding: 12px;
      font-family: 'Bungee', sans-serif;
      background: rgba(139,98,148,0.85);
      backdrop-filter: blur(6px);
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      transition: 0.3s;
    }

    nav a:hover {
      color: #e9d5ff;
    }

    /* Mood Picker */
    .mood-box {
      text-align: center;
      margin: 50px auto;
      max-width: 700px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .moods button {
      background: #ad7edd;
      border: none;
      color: white;
      padding: 12px 20px;
      margin: 10px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Bungee', sans-serif;
      transition: 0.3s;
    }

    .moods button:hover {
      background: #8b6294;
      transform: scale(1.1);
    }

    .result {
      margin-top: 30px;
      font-size: 1.2rem;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .result button {
      margin-top: 15px;
      padding: 10px 20px;
      border-radius: 15px;
      border: none;
      background: #c084fc;
      color: white;
      cursor: pointer;
      font-family: 'Bungee', sans-serif;
      transition: 0.3s;
    }

    .result button:hover {
      background: #8b6294;
      transform: scale(1.1);
    }
  </style>
</head>

<body>

  <header>LANDOKMAI FAN</header>

  <nav>
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="#">LANDOKMAI</a>
  </nav>

  <div class="mood-box">
    <h2>เลือกอารมณ์ของคุณ 💭</h2>

    <div class="moods">
      <button onclick="getMood('sad')">😢 เศร้า</button>
      <button onclick="getMood('lonely')">🌙 เหงา</button>
      <button onclick="getMood('happy')">😊 มีความสุข</button>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script>
    // ข้อมูลเพลง (Front-end ล้วน)
    const moodData = {
      sad: {
        song: "Over the Sun",
        desc: "เพลงเศร้าหลังฝน",
        link: "sun.html"
      },
      lonely: {
        song: "All My Purple Feeling",
        desc: "ความเหงาที่สวยงาม",
        link: "purple.html"
      },
      happy: {
        song: "WHAT EVE",
        desc: "เพลงฟีลดีสดใส",
        link: "what.html"
      }
    };

    function getMood(mood) {
      const data = moodData[mood];

      document.getElementById("result").innerHTML = `
        <h3>${data.song}</h3>
        <p>${data.desc}</p>
        <button onclick="goPage('${data.link}')">ไปฟังเพลง 🎧</button>
      `;
    }

    function goPage(link) {
      window.location.href = link;
    }
  </script>

</body>
</html>
