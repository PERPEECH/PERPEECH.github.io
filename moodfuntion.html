
<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LANDOKMAI FAN • Mood Picker</title>

  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Prompt', sans-serif;
      background-image: url("bg2.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #f5f3ff;
      min-height: 100vh;
    }


    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, rgba(107,33,168,0.6), rgba(30,27,75,0.9));
      z-index: -1;
    }

    header {
      text-align: center;
      padding: 20px;
      font-family: 'Bungee', sans-serif;
      font-size: 2.2rem;
      background: rgba(173,126,221,0.9);
      backdrop-filter: blur(8px);
      color: white;
      letter-spacing: 1px;
    }

    nav {
      text-align: center;
      padding: 12px;
      font-family: 'Bungee', sans-serif;
      background: rgba(139,98,148,0.85);
      backdrop-filter: blur(6px);
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      transition: 0.3s;
    }

    nav a:hover {
      color: #e9d5ff;
    }

    /* Mood Picker */
    .mood-box {
      text-align: center;
      margin: 50px auto;
      max-width: 700px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .moods button {
      background: #ad7edd;
      border: none;
      color: white;
      padding: 12px 20px;
      margin: 10px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Bungee', sans-serif;
      transition: 0.3s;
    }

    .moods button:hover {
      background: #8b6294;
      transform: scale(1.1);
    }

    .result {
      margin-top: 30px;
      font-size: 1.2rem;
      animation: fadeIn 0.4s ease;
      text-align: left;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .result button {
      margin-top: 5px;
      padding: 6px 12px;
      border-radius: 12px;
      border: none;
      background: #c084fc;
      color: white;
      cursor: pointer;
      font-family: 'Bungee', sans-serif;
      transition: 0.3s;
      font-size: 0.9rem;
    }

    .result button:hover {
      background: #8b6294;
      transform: scale(1.05);
    }

    .result ul {
      margin-top: 10px;
      padding-left: 20px;
    }

    .result li {
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <header>LANDOKMAI FAN</header>

  <nav>
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="#">LANDOKMAI</a>
  </nav>

  <div class="mood-box">
    <h2>เลือกอารมณ์ของคุณ </h2>

    <div class="moods">
      <button onclick="getMood('sad')">SAD</button>
      <button onclick="getMood('lonely')">LONELY</button>
      <button onclick="getMood('happy')">HAPPY</button>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script>
    const moodData = {
      sad: {
        songs: [
          {name: "เพลงรักเพลงแรก (Blooming)", link: "blooming.html"},
          {name: "ยอม (White Flag)", link: "whiteflag.html"},
          {name: "Blooming (เพลงรักเพลงแรก) (Live Session)", link: "blooming-live.html"},
          {name: "I miss you when I’m drunk", link: "imissyou.html"},
          {name: "I’m saying goodbye", link: "goodbye.html"},
          {name: "Hearsay", link: "hearsay.html"},
          {name: "Fall in love too easily", link: "fallinlove.html"},
          {name: "Love me still", link: "lovemestill.html"},
          {name: "Bye Bye Neverland", link: "byebye.html"}
        ],
        desc: "เพลงเศร้าหรือความรักเจ็บปวด"
      },
      lonely: {
        songs: [
          {name: "ฤดูฝัน (Drizzle)", link: "drizzle.html"},
          {name: "ทำนองแห่งท้องทะเล (Lullaby of the Sea)", link: "lullaby-sea.html"},
          {name: "เมื่อไหร่ที่คิดถึงเธอ (Echo)", link: "echo.html"},
          {name: "ในวันพรุ่งนี้ขอให้เป็นวันที่ดี (Nomad’s Lullaby)", link: "nomads.html"},
          {name: "Welcome to My Purple Story", link: "purple-story.html"},
          {name: "ปลายฝนต้นหนาว (Winter Breeze)", link: "winter-breeze.html"},
          {name: "เกาะลอยฟ้า (still)", link: "still.html"}
        ],
        desc: "เพลงเหงา สงบ หรือคิดถึง"
      },
      happy: {
        songs: [
          {name: "B-D-BUB-BA", link: "bdbubba.html"},
          {name: "TAXI", link: "taxi.html"},
          {name: "Mr.Masterpiece", link: "masterpiece.html"},
          {name: "Finger paint", link: "fingerpaint.html"}
        ],
        desc: "เพลงสดใส สนุก อบอุ่น"
      }
    };

    function getMood(mood) {
      const data = moodData[mood];
      const songList = data.songs.map(song => 
        `<li>${song.name} <button onclick="goPage('${song.link}')">ฟัง 🎧</button></li>`
      ).join("");

      document.getElementById("result").innerHTML = `
        <h3>เพลงสำหรับ Mood: ${mood.toUpperCase()}</h3>
        <p>${data.desc}</p>
        <ul>${songList}</ul>
      `;
    }

    function goPage(link) {
      window.location.href = link;
    }
  </script>

</body>
</html>
