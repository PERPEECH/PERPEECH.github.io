<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* === BASIC === */
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #2e1a3c;
            color: white;
        }
        header {
            background-color: #ad7edd;
            padding: 20px;
            text-align: center;
            font-size: 2.5rem;
            font-family: 'Bungee', sans-serif;
        }
        nav {
            background-color: #8b6294;
            padding: 10px;
            text-align: center;
            font-family: 'Bungee', sans-serif;
        }
        nav a {
            margin: 0 20px;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
        }
        nav a:hover {
            text-decoration: underline;
        }

        /* === BACKGROUND IMAGE === */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("bg2.png");
            background-size: cover;
            background-position: center;
            opacity: 0.5;
            z-index: -1;
        }

        /* === ALBUM GRID === */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            margin: 50px 20px;
            flex-wrap: wrap;
        }
        .card {
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .card img {
            width: 260px;
            height: 260px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.3s;
        }
        .card img:hover {
            transform: scale(1.15);
        }
        .card p {
            margin-top: 10px;
            font-size: 1.1rem;
            color: white;
        }

        /* === SONG LIST MODAL === */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.8);
            z-index: 100;
        }
        .modal-content {
            background-color: #4b2e72;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            animation: scale-up-center 0.4s ease forwards;
        }
        .modal-content h2 {
            font-family: 'Bungee', sans-serif;
            margin-bottom: 20px;
            color: #ffd6f7;
        }
        .modal-content ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .modal-content ul li {
            margin: 15px 0;
            font-size: 1.1rem;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            transition: background 0.3s;
        }
        .modal-content ul li:hover {
            background: rgba(255,255,255,0.3);
        }
        .close-btn {
            margin-top: 20px;
            padding: 8px 20px;
            background: #ad7edd;
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Bungee', sans-serif;
            cursor: pointer;
            font-size: 1rem;
        }

        @keyframes scale-up-center {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="bg"></div>

<header>LANDOKMAI</header>
<nav>
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="moodfuntion.html">LANDOKMAI</a>
</nav>

<div class="container">
    <div class="card" onclick="openAlbum('what')">
        <img src="ab3.png" alt="what eve">
        <p>what eve</p>
    </div>
    <div class="card" onclick="openAlbum('sun')">
        <img src="ab1.png" alt="Over the sun">
        <p>Over the sun</p>
    </div>
    <div class="card" onclick="openAlbum('purple')">
        <img src="ab2.png" alt="All my purple feeling">
        <p>All my purple feeling</p>
    </div>
</div>


<div class="modal" id="albumModal">
    <div class="modal-content">
        <h2 id="albumTitle">Album Name</h2>
        <ul id="songList">
         
        </ul>
        <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
    const albums = {
        what: {
            title: "what eve",
            songs: [
                "Song 1 - Hearsay",
                "Song 2 - Finger paint",
                "Song 3 - Love me still",
                "Song 4 - Mr.Masterpiece",
                "Song 5 - Bye Bye Neverland"
            ]
        },
        sun: {
            title: "Over the sun",
            songs: [
                "Please be true",
                "ฉันเอง..นี่ไง",
                "ฟ้า(blueheart)",
                "Our sunset"
                
            ]
        },
        purple: {
            title: "All my purple feeling",
            songs: [
                "Welcome to my purple story",
                "เมื่อไหร่ที่คิดถึงเธอ(Echo)",
                "ยอม(White flag)",
                "ฤดูฝัน(Drizzle)",
                "เพลงรักเพลงแรก(Blooming)",
                "B-D-BUB-BA",
                "Taxi",
                "  I miss you when i'm drunk",
                "ในวันพรุ่งนี้ขอให้เป็นวันที่ดี(Nomad lullaby)",
                "I'm saying goodbye"
                
            ]
        }
    };

    function openAlbum(albumKey) {
        const modal = document.getElementById('albumModal');
        const title = document.getElementById('albumTitle');
        const list = document.getElementById('songList');
        const album = albums[albumKey];

        title.textContent = album.title;
        list.innerHTML = '';
        album.songs.forEach(song => {
            const li = document.createElement('li');
            li.textContent = song;
            list.appendChild(li);
        });
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('albumModal').style.display = 'none';
    }
</script>

</body>
</html>
