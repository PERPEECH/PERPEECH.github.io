@keyframes scale-up-center {
    from {
        transform: scale(0.5);
        opacity: 0;

    to {
        transform: scale(1);

    }
}

body {
    margin: 0;
    font-family: sans-serif;
}

.bg {
    position: fixed;
    top: 0;
    left: 0;

    height: 100%;

    background-image: url("bg2.png");
    background-size: cover;
    background-position: center;

    opacity: 0.5;
    z-index: -1;
}

header {
    background-color: #ad7edd;
    color: white;
    padding: 15px;

}

/* === NEW ALBUM SECTION === */

}

.card {
    text-align: center;
}

.card img {
    width: 260px;
    height: 260px;
    object-fit: cover;
    border-radius: 20px;

    transform: scale(0.5);
    opacity: 0;
    animation: scale-up-center 0.6s ease forwards;
    transition: 0.3s;

    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.card img:hover {
    transform: scale(1.15);
}

.card p {
